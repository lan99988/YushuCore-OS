plugin_id: knowledge
name: Knowledge Plugin
version: 1.0.0
purpose: 通过 Knowledge Gateway 提供受权限控制的只读知识查询
domain: knowledge
provides:
  - knowledge.search
  - knowledge.list
  - knowledge.get
  - knowledge.evidence_context
  - knowledge.read_context
  - knowledge.get_schema
  - knowledge.health
reads:
  - ima.knowledge_base
  - ima.authorized_summary_cache
writes: []
dependencies: []
permissions:
  - read_knowledge
capability_permissions:
  knowledge.search:
    - read_knowledge
  knowledge.list:
    - read_knowledge
  knowledge.get:
    - read_knowledge
  knowledge.evidence_context:
    - read_knowledge
  knowledge.read_context:
    - read_knowledge
  knowledge.get_schema:
    - read_knowledge
  knowledge.health:
    - read_knowledge
capability_effects:
  knowledge.search: read_only
  knowledge.list: read_only
  knowledge.get: read_only
  knowledge.evidence_context: read_only
  knowledge.read_context: read_only
  knowledge.get_schema: read_only
  knowledge.health: read_only
input_contract:
  knowledge.list:
    type: object
    additionalProperties: false
  knowledge.search:
    type: object
    properties:
      query: {type: string, minLength: 1}
      time_range: {type: string}
    required: [query]
  knowledge.get:
    type: object
    properties:
      node_id: {type: string, minLength: 1}
    required: [node_id]
  knowledge.evidence_context:
    type: object
    properties:
      task: {type: string, minLength: 1}
    required: [task]
  knowledge.read_context:
    type: object
    properties:
      task: {type: string, minLength: 1}
    required: [task]
  knowledge.get_schema:
    type: object
    properties:
      node_id: {type: string, minLength: 1}
    required: [node_id]
  knowledge.health:
    type: object
    additionalProperties: false
risk_level: low
activation_mode: always
availability: installed
enabled: true
activation_state: active
