plugin_id: body
name: Body Plugin
version: 1.0.0
purpose: 复用现有身体快照评估和 Body OS 指令处理入口
domain: body
provides:
  - body.current_energy
  - body.recovery_context
  - body.training_context
  - body.adjustment_suggestion
reads:
  - garmin.body_dataset
  - garmin.body_runtime
writes: []
dependencies: []
permissions:
  - read_body_snapshot
capability_permissions:
  body.current_energy:
    - read_body_snapshot
  body.recovery_context:
    - read_body_snapshot
  body.training_context:
    - read_body_snapshot
  body.adjustment_suggestion:
    - read_body_snapshot
capability_effects:
  body.current_energy: read_only
  body.recovery_context: read_only
  body.training_context: read_only
  body.adjustment_suggestion: read_only
risk_level: medium
activation_mode: on_demand
availability: installed
enabled: true
activation_state: dormant
