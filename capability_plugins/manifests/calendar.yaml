plugin_id: calendar
name: Calendar Plugin
version: 1.0.0
purpose: 复用现有日程安排入口
domain: calendar
provides:
  - calendar.list_events
  - calendar.find_free_slots
  - calendar.check_conflict
  - calendar.create_proposal
  - calendar.move_proposal
reads:
  - feishu.calendar
  - schedule.runtime
writes: []
dependencies: []
permissions:
  - read_calendar
  - propose_calendar_change
capability_permissions:
  calendar.list_events:
    - read_calendar
  calendar.find_free_slots:
    - read_calendar
  calendar.check_conflict:
    - read_calendar
  calendar.create_proposal:
    - propose_calendar_change
  calendar.move_proposal:
    - propose_calendar_change
capability_effects:
  calendar.list_events: read_only
  calendar.find_free_slots: read_only
  calendar.check_conflict: read_only
  calendar.create_proposal: proposal
  calendar.move_proposal: proposal
risk_level: medium
activation_mode: always
availability: installed
enabled: true
activation_state: active
