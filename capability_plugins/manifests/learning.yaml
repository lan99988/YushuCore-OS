plugin_id: learning
name: Learning Plugin
version: 1.0.0
purpose: 通过宿主只读数据源读取学习状态、进度与上下文
domain: learning
provides:
  - learning.current_state
  - learning.progress
  - learning.context
reads:
  - learning.state
  - learning.progress
  - learning.context
  - knowledge.vault
writes: []
dependencies: []
permissions:
  - read_knowledge
capability_permissions:
  learning.current_state:
    - read_knowledge
  learning.progress:
    - read_knowledge
  learning.context:
    - read_knowledge
capability_effects:
  learning.current_state: read_only
  learning.progress: read_only
  learning.context: read_only
risk_level: low
activation_mode: on_demand
availability: installed
enabled: true
activation_state: dormant
