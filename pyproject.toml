[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yushuos-core"
version = "0.2.1"
description = "A lightweight, host-independent personal AI operating system core"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "lan99988" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
yushuos = "yushuos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yushuos", "yushuos.*", "yushuos_sdk", "yushuos_sdk.*", "templates"]

[tool.setuptools.package-data]
templates = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
